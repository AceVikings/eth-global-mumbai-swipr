name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No database service and no network writes: unit and contract tests use the in-memory
    # Arkiv test adapter. No secrets are configured, so nothing can reach live Arkiv.
    env:
      APP_MODE: preview
      # Placeholder public address so the doctor can check config shape; not a real writer.
      ARKIV_WRITER_ADDRESS: "0x0000000000000000000000000000000000000001"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject tracked local files
        run: |
          python3 - <<'PYTHON'
          import pathlib, subprocess, sys
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          local_dirs = {'.context', '.tokensave', '.playwright-cli', 'node_modules', 'dist', 'dist-server', 'docs', 'scripts', 'design'}
          local_names = {'.DS_Store', '.dockerignore', '.gcloudignore', 'design-qa.md', 'runtime.json'}
          bad = []
          for value in filter(None, paths):
              path = pathlib.PurePosixPath(value)
              secret_env = path.name == '.env' or (path.name.startswith('.env.') and path.name != '.env.example')
              if local_dirs.intersection(path.parts) or path.name in local_names or secret_env or value == 'infra/secrets.sh' or path.name.startswith('gha-creds-'):
                  bad.append(value)
          if bad:
              print('Untrack local-only files before publishing:\n' + '\n'.join(bad))
              sys.exit(1)
          print('No local-only files are tracked.')
          PYTHON
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Verify browser and backend API contracts agree
        run: diff --recursive --exclude="*.test.ts" backend/contracts frontend/src/contracts
      - run: npm ci --prefix frontend
      - run: npm ci --prefix backend
      - run: npm run typecheck --prefix frontend
      - run: npm run typecheck --prefix backend
      - run: npm test --prefix frontend
      - run: npm test --prefix backend
      - run: npm run build --prefix frontend
      - run: npm run check:bundle --prefix frontend

  backend:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      COMMIT_SHA: ${{ github.sha }}
      FUNDING_START_NONCE: ${{ vars.ARKIV_FUNDING_START_NONCE }}
      MEDIA_BEE_URL: ${{ vars.SWARM_BEE_URL }}
      MEDIA_BATCH_ID: ${{ vars.SWARM_BATCH_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build backend image (no credentials in build)
        run: docker build --tag swipr-backend:ci backend
      - name: Smoke test API and worker containers
        run: |
          set -euo pipefail
          trap 'docker rm --force swipr-api-smoke swipr-worker-smoke >/dev/null 2>&1 || true' EXIT
          docker run --rm --entrypoint sh swipr-backend:ci -c 'test ! -e /app/.env && test ! -d /app/frontend && test ! -d /app/docs && test ! -d /app/.context'
          docker run --detach --name swipr-api-smoke -e APP_MODE=preview -e BOT_AUTH_AUDIENCE=https://swipr.example -e PORT=8787 -p 127.0.0.1:8787:8787 swipr-backend:ci
          docker run --detach --name swipr-worker-smoke -e APP_MODE=preview -e BOT_AUTH_AUDIENCE=https://swipr.example -e PORT=8788 -p 127.0.0.1:8788:8788 swipr-backend:ci npm run worker
          for port in 8787 8788; do
            if ! curl --fail --retry 10 --retry-all-errors --retry-delay 1 "http://127.0.0.1:${port}/health"; then
              docker logs swipr-api-smoke
              docker logs swipr-worker-smoke
              exit 1
            fi
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:${port}/ready")" = 503
          done
      - id: auth
        name: Authenticate deployer with GitHub OIDC
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SWIPR_DEPLOY_ENABLED == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SWIPR_DEPLOY_ENABLED == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Sync backend secrets to Secret Manager
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SWIPR_DEPLOY_ENABLED == 'true'
        env:
          PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
          PRIVY_APP_SECRET: ${{ secrets.PRIVY_APP_SECRET }}
          PRIVY_VERIFICATION_KEY: ${{ secrets.PRIVY_VERIFICATION_KEY }}
          FLASH_KEY_EXEC: ${{ secrets.FLASH_KEY_EXEC }}
          ARKIV_ACCESS_KEY: ${{ secrets.ARKIV_ACCESS_KEY }}
          ARKIV_RELAYER_PK: ${{ secrets.ARKIV_RELAYER_PK }}
          ARKIV_MAINTAINER_PK: ${{ secrets.ARKIV_MAINTAINER_PK }}
          ENS_REGISTRAR_PK: ${{ secrets.ENS_REGISTRAR_PK }}
          PRIVY_AUTOMATION_KEY: ${{ secrets.PRIVY_AUTOMATION_KEY }}
          PRIVY_AUTOMATION_SIGNER_ID: ${{ secrets.PRIVY_AUTOMATION_SIGNER_ID }}
        run: |
          set -euo pipefail
          for mapping in PRIVY_APP_ID:swipr-privy-app-id PRIVY_APP_SECRET:swipr-privy-app-secret PRIVY_VERIFICATION_KEY:swipr-privy-verification-key FLASH_KEY_EXEC:swipr-flash-key-exec ARKIV_ACCESS_KEY:swipr-arkiv-access-key ARKIV_RELAYER_PK:swipr-arkiv-relayer-pk ARKIV_MAINTAINER_PK:swipr-arkiv-maintainer-pk ENS_REGISTRAR_PK:swipr-ens-registrar-pk PRIVY_AUTOMATION_KEY:swipr-privy-automation-key PRIVY_AUTOMATION_SIGNER_ID:swipr-privy-automation-signer-id; do
            key="${mapping%%:*}"
            secret="${mapping#*:}"
            test -n "${!key}"
            printf '%s' "${!key}" | gcloud secrets versions add "$secret" --project "$PROJECT_ID" --data-file=- --quiet >/dev/null
          done
      - name: Push commit image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SWIPR_DEPLOY_ENABLED == 'true'
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/swipr/backend:${COMMIT_SHA}"
          docker tag swipr-backend:ci "$IMAGE_URI"
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
      - name: Release worker then API
        id: release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SWIPR_DEPLOY_ENABLED == 'true'
        run: |
          set -euo pipefail
          : "${PROJECT_ID:?}" "${REGION:?}" "${IMAGE_URI:?}" "${COMMIT_SHA:?}"
          [[ "$IMAGE_URI" == "${REGION}-docker.pkg.dev/${PROJECT_ID}/swipr/backend:${COMMIT_SHA}" ]] || exit 2
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          digest="$(gcloud artifacts docker images describe "$IMAGE_URI" --project "$PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Image digest could not be verified' >&2; exit 2; }
          immutable_image="${IMAGE_URI%:*}@${digest}"
          for role in worker api; do
            service="swipr-${role}"
            expected="${service}@${PROJECT_ID}.iam.gserviceaccount.com"
            actual="$(gcloud run services describe "$service" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.serviceAccountName)')"
            [[ "$actual" == "$expected" ]] || { echo "Unexpected runtime identity on ${service}" >&2; exit 3; }
            extra=(--update-secrets "PRIVY_AUTOMATION_SIGNER_ID=swipr-privy-automation-signer-id:latest")
            if [[ "$role" == worker ]]; then
              [[ "$FUNDING_START_NONCE" =~ ^[0-9]+$ ]]
              extra+=(--update-env-vars "ARKIV_FUNDING_ENABLED=true,ARKIV_FUNDING_START_NONCE=${FUNDING_START_NONCE}")
              extra+=(--update-secrets "ARKIV_RELAYER_PK=swipr-arkiv-relayer-pk:latest,ARKIV_MAINTAINER_PK=swipr-arkiv-maintainer-pk:latest,ENS_REGISTRAR_PK=swipr-ens-registrar-pk:latest,PRIVY_AUTOMATION_KEY=swipr-privy-automation-key:latest")
            fi
            if [[ "$role" == api && -n "$MEDIA_BEE_URL" ]]; then
              [[ "$MEDIA_BEE_URL" =~ ^http://10\.[0-9]+\.[0-9]+\.[0-9]+:1633$ ]]
              [[ "$MEDIA_BATCH_ID" =~ ^[0-9a-f]{64}$ ]]
              extra+=(--network default --subnet default --vpc-egress private-ranges-only --network-tags swipr-media-client)
              extra+=(--update-env-vars "BEE_URL=${MEDIA_BEE_URL},SWARM_BATCH_ID=${MEDIA_BATCH_ID}")
            fi
            gcloud run services update "$service" --project "$PROJECT_ID" --region "$REGION" \
              --image "$immutable_image" --update-labels "commit-sha=${COMMIT_SHA}" "${extra[@]}" --quiet
            gcloud run services update-traffic "$service" --project "$PROJECT_ID" --region "$REGION" --to-latest --quiet
            url="$(gcloud run services describe "$service" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
            if [[ -n "${GITHUB_OUTPUT:-}" ]]; then printf '%s_url=%s\n' "$role" "$url" >> "$GITHUB_OUTPUT"; fi
            echo "Released ${service} at commit ${COMMIT_SHA}"
          done
      - name: Verify public API and private worker boundary
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SWIPR_DEPLOY_ENABLED == 'true'
        env:
          API_URL: ${{ steps.release.outputs.api_url }}
          WORKER_URL: ${{ steps.release.outputs.worker_url }}
        run: |
          curl --fail --retry 5 --retry-delay 2 "$API_URL/health"
          curl --fail "$API_URL/api/runtime" > runtime.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$WORKER_URL/health")" = 403
          {
            echo '### Cloud Run infrastructure released'
            echo "Commit: $COMMIT_SHA"
            echo "API: $API_URL"
            echo 'Worker rejects anonymous requests. Product readiness is separate from deployment.'
            jq '{mode, tradingEnabled, integrations}' runtime.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Authenticate worker health probe
        id: worker-auth
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SWIPR_DEPLOY_ENABLED == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.release.outputs.worker_url }}
          id_token_include_email: true
      - name: Verify authenticated worker writer readiness
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SWIPR_DEPLOY_ENABLED == 'true'
        env:
          WORKER_URL: ${{ steps.release.outputs.worker_url }}
          WORKER_ID_TOKEN: ${{ steps.worker-auth.outputs.id_token }}
        run: |
          for attempt in {1..12}; do
            if curl --silent --fail -H "Authorization: Bearer $WORKER_ID_TOKEN" "$WORKER_URL/ready" > worker-ready.json &&
              jq --exit-status '.ready == true and .writable == true' worker-ready.json; then exit 0; fi
            sleep 5
          done
          echo 'Worker has not confirmed a healthy writable Arkiv journal.' >&2
          exit 1

  frontend:
    needs: backend
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SWIPR_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Publish the checked commit to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const { RENDER_API_KEY: key, RENDER_SERVICE_ID: service, COMMIT_SHA: sha } = process.env;
          if (!key || !/^srv-[a-z0-9]+$/.test(service || '') || !/^[a-f0-9]{40}$/.test(sha || '')) throw new Error('Render release configuration is missing.');
          const request = async (path, body) => {
            const response = await fetch(`https://api.render.com/v1${path}`, {
              method: body ? 'POST' : 'GET', signal: AbortSignal.timeout(15000),
              headers: { authorization: `Bearer ${key}`, 'content-type': 'application/json' },
              ...(body ? { body: JSON.stringify(body) } : {}),
            });
            if (!response.ok) throw new Error(`Render request failed (${response.status}). Check existing deployments before retrying.`);
            return response.json();
          };
          const failed = new Set(['build_failed', 'update_failed', 'pre_deploy_failed', 'canceled', 'deactivated']);
          // Reconcile an earlier accepted deployment on reruns; never blindly retry a POST.
          const existing = await request(`/services/${service}/deploys?limit=10`);
          let deployment = existing.map(row => row.deploy).find(d => d.commit?.id === sha && !failed.has(d.status));
          if (!deployment) deployment = await request(`/services/${service}/deploys`, { commitId: sha, clearCache: 'do_not_clear' });
          if (!/^dep-[a-z0-9]+$/.test(deployment.id || '')) throw new Error('Render did not return a deployment ID.');
          for (let attempt = 0; attempt < 72; attempt++) {
            deployment = await request(`/services/${service}/deploys/${deployment.id}`);
            if (deployment.commit?.id !== sha) throw new Error('Render deployment commit does not match the checked source.');
            console.log(JSON.stringify({ deployment: deployment.id, status: deployment.status, commit: sha }));
            if (deployment.status === 'live') {
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Render frontend released\nCommit: ${sha}\nDeployment: ${deployment.id}\n`);
              process.exit(0);
            }
            if (failed.has(deployment.status)) throw new Error(`Render deployment ${deployment.status}.`);
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          throw new Error('Render deployment is still pending. Check its deployment ID before retrying.');
          NODE
