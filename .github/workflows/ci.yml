name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No database service and no network writes: unit and contract tests use the in-memory
    # Arkiv test adapter. No secrets are configured, so nothing can reach live Arkiv.
    env:
      APP_MODE: preview
      # Placeholder public address so the doctor can check config shape; not a real writer.
      ARKIV_WRITER_ADDRESS: "0x0000000000000000000000000000000000000001"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject tracked local files
        run: |
          python3 - <<'PYTHON'
          import pathlib, subprocess, sys
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          local_dirs = {'.context', '.tokensave', '.playwright-cli', 'node_modules', 'dist', 'dist-server', 'docs', 'scripts', 'design'}
          local_names = {'.DS_Store', '.dockerignore', '.gcloudignore', 'design-qa.md', 'runtime.json'}
          bad = []
          for value in filter(None, paths):
              path = pathlib.PurePosixPath(value)
              secret_env = path.name == '.env' or (path.name.startswith('.env.') and path.name != '.env.example')
              if local_dirs.intersection(path.parts) or path.name in local_names or secret_env or value == 'infra/secrets.sh' or path.name.startswith('gha-creds-'):
                  bad.append(value)
          if bad:
              print('Untrack local-only files before publishing:\n' + '\n'.join(bad))
              sys.exit(1)
          print('No local-only files are tracked.')
          PYTHON
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Verify browser and backend API contracts agree
        run: diff --recursive backend/contracts frontend/src/contracts
      - run: npm ci --prefix frontend
      - run: npm ci --prefix backend
      - run: npm run typecheck --prefix frontend
      - run: npm run typecheck --prefix backend
      - run: npm test --prefix frontend
      - run: npm test --prefix backend
      - run: npm run build --prefix frontend
      - run: npm run check:bundle --prefix frontend

  backend:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build backend image (no credentials in build)
        run: docker build --tag swipr-backend:ci backend
      - id: auth
        name: Authenticate deployer with GitHub OIDC
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SWIPR_DEPLOY_ENABLED == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SWIPR_DEPLOY_ENABLED == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Push commit image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SWIPR_DEPLOY_ENABLED == 'true'
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/swipr/backend:${COMMIT_SHA}"
          docker tag swipr-backend:ci "$IMAGE_URI"
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
      - name: Release worker then API
        id: release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SWIPR_DEPLOY_ENABLED == 'true'
        run: |
          set -euo pipefail
          : "${PROJECT_ID:?}" "${REGION:?}" "${IMAGE_URI:?}" "${COMMIT_SHA:?}"
          [[ "$IMAGE_URI" == "${REGION}-docker.pkg.dev/${PROJECT_ID}/swipr/backend:${COMMIT_SHA}" ]] || exit 2
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          digest="$(gcloud artifacts docker images describe "$IMAGE_URI" --project "$PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Image digest could not be verified' >&2; exit 2; }
          immutable_image="${IMAGE_URI%:*}@${digest}"
          for role in worker api; do
            service="swipr-${role}"
            expected="${service}@${PROJECT_ID}.iam.gserviceaccount.com"
            actual="$(gcloud run services describe "$service" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.serviceAccountName)')"
            [[ "$actual" == "$expected" ]] || { echo "Unexpected runtime identity on ${service}" >&2; exit 3; }
            gcloud run services update "$service" --project "$PROJECT_ID" --region "$REGION" \
              --image "$immutable_image" --update-labels "commit-sha=${COMMIT_SHA}" --quiet
            gcloud run services update-traffic "$service" --project "$PROJECT_ID" --region "$REGION" --to-latest --quiet
            url="$(gcloud run services describe "$service" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
            if [[ -n "${GITHUB_OUTPUT:-}" ]]; then printf '%s_url=%s\n' "$role" "$url" >> "$GITHUB_OUTPUT"; fi
            echo "Released ${service} at commit ${COMMIT_SHA}"
          done
      - name: Verify public API and private worker boundary
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SWIPR_DEPLOY_ENABLED == 'true'
        env:
          API_URL: ${{ steps.release.outputs.api_url }}
          WORKER_URL: ${{ steps.release.outputs.worker_url }}
        run: |
          curl --fail --retry 5 --retry-delay 2 "$API_URL/health"
          curl --fail "$API_URL/api/runtime" > runtime.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$WORKER_URL/health")" = 403
          {
            echo '### Cloud Run infrastructure released'
            echo "Commit: $COMMIT_SHA"
            echo "API: $API_URL"
            echo 'Worker rejects anonymous requests. Product readiness is separate from deployment.'
            jq '{mode, tradingEnabled, integrations}' runtime.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Authenticate worker health probe
        id: worker-auth
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SWIPR_DEPLOY_ENABLED == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.release.outputs.worker_url }}
          id_token_include_email: true
      - name: Verify authenticated worker liveness
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SWIPR_DEPLOY_ENABLED == 'true'
        env:
          WORKER_URL: ${{ steps.release.outputs.worker_url }}
          WORKER_ID_TOKEN: ${{ steps.worker-auth.outputs.id_token }}
        run: |
          curl --fail --retry 5 --retry-delay 2 -H "Authorization: Bearer $WORKER_ID_TOKEN" "$WORKER_URL/health"
