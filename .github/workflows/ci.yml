name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: swipr
          POSTGRES_PASSWORD: swipr-ci-only
          POSTGRES_DB: swipr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U swipr -d swipr"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_MODE: preview
      # Throwaway CI database for integration tests; not a secret.
      DATABASE_URL: postgres://swipr:swipr-ci-only@localhost:5432/swipr
      LEDGER_TEST_DATABASE_URL: postgres://swipr:swipr-ci-only@localhost:5432/swipr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Doctor (backend config, preview mode)
        run: npm run doctor -- --role api,worker

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (not pushed)
        run: docker build --tag swipr-backend:ci .
