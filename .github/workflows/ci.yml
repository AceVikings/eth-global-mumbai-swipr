name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No database service and no network writes: unit and contract tests use the in-memory
    # Arkiv test adapter. No secrets are configured, so nothing can reach live Arkiv.
    env:
      APP_MODE: preview
      # Placeholder public address so the doctor can check config shape; not a real writer.
      ARKIV_WRITER_ADDRESS: "0x0000000000000000000000000000000000000001"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - name: Doctor (backend config, preview mode)
        run: npm run doctor -- --role api,worker

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (not pushed)
        run: docker build --tag swipr-backend:ci .
