# Render Blueprint for the static frontend only (backend: Cloud Run, see docs/INFRASTRUCTURE.md).
# Equivalent configuration for the swipr-web static site created through the Render API.
services:
  - type: web
    runtime: static
    name: swipr-web
    branch: main
    autoDeployTrigger: checksPass
    rootDir: frontend
    buildCommand: npm ci && npm run build && npm run check:bundle
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set in the dashboard to the Cloud Run API URL once it exists. Public, never a secret.
      - key: VITE_API_URL
        sync: false
      - key: VITE_PRIVY_APP_ID
        sync: false
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
