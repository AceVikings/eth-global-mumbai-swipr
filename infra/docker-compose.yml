# Local stack only: API + worker containers. No database container: Arkiv is the only store.
# Run from the repo root: docker compose -f infra/docker-compose.yml up --build
# Requires ../.env (cp .env.example .env). Preview needs only ARKIV_WRITER_ADDRESS; the worker
# writes to Arkiv only when ARKIV_RELAYER_PK is set, and the API never receives it here.
name: swipr

x-backend: &backend
  build: { context: .., dockerfile: Dockerfile }
  image: swipr-backend:local
  init: true
  restart: unless-stopped
  env_file: [../.env]
x-probe: &probe { interval: 15s, timeout: 5s, start_period: 20s, retries: 3 }

services:
  api:
    <<: *backend
    command: ["npm", "run", "api"]
    environment:
      PORT: "8787"
      NODE_ENV: development  # allows the default http://127.0.0.1:5173 CORS origin
      ARKIV_RELAYER_PK: ""   # worker-only secrets; blanked even if .env holds them
      ARKIV_MAINTAINER_PK: ""
    ports: ["127.0.0.1:8787:8787"]
    healthcheck: # /readyz and /ready are aliases, as are /healthz and /health
      <<: *probe
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]

  worker:
    <<: *backend
    command: ["npm", "run", "worker"]
    environment: { PORT: "8788", NODE_ENV: development }
    ports: ["127.0.0.1:8788:8788"]
    healthcheck:
      <<: *probe
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
